<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Send Message</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light Theme Overrides */
        body.light-mode {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
        }
        body.light-mode .single-unified-card,
        body.light-mode .icon-btn {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08) !important;
        }
        body.light-mode .message-input-box {
            background: #f8fafc !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode h3 {
            color: #0f172a !important;
        }
        body.light-mode .icon-btn {
            color: #0f172a !important;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        @media (min-width: 480px) {
            .main-container {
                height: 90vh;
                border-radius: 36px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            }
        }

        /* Top Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .icon-btn:active {
            transform: scale(0.92);
        }

        /* Single Unified Card */
        .single-unified-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 28px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            margin: auto 0;
            transition: all 0.3s ease;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            border: 2px solid #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
            overflow: hidden;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-input-box {
            width: 100%;
            height: 120px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
            user-select: text;
        }

        .message-input-box:focus {
            border-color: #ec4899;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #db2777 0%, #ff5e36 100%);
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            padding: 15px;
            border-radius: 35px;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 94, 54, 0.3);
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            transition: transform 0.1s ease;
        }
        .btn-action-primary:active {
            transform: scale(0.97);
        }

        .btn-action-secondary {
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            font-weight: 700;
            width: 100%;
            padding: 14px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-action-secondary:active {
            transform: scale(0.97);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;">
        <div style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; border-radius: 24px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); max-width: 280px; width: 90%;">
            <div style="font-size: 32px; margin-bottom: 12px; color: #ec4899;"><i class="fas fa-info-circle"></i></div>
            <h3 style="color: #f8fafc; font-size: 16px; font-weight: 700; margin-bottom: 6px;">Notification</h3>
            <p id="customAlertText" style="color: #94a3b8; font-size: 12px; margin-bottom: 20px; line-height: 1.4;">Action successful!</p>
            <button id="customAlertOkBtn" style="background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; border: none; width: 100%; padding: 12px; border-radius: 30px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 5px 15px rgba(219,39,119,0.4);">OK</button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Top Bar -->
        <div class="top-nav">
            <button id="themeToggleBtn" class="icon-btn" type="button">
                <i id="themeIcon" class="fas fa-moon" style="font-size: 14px;"></i>
            </button>
            <h2 id="headerUsernameTitle" style="font-size: 14px; font-weight: 800; color: #cbd5e1;">Nostelgic NGL</h2>
            <div style="width: 42px;"></div>
        </div>

        <!-- Single Unified Card -->
        <div class="single-unified-card">
            
            <!-- Step 1: Input Form View -->
            <div id="formSection">
                <div>
                    <div class="avatar-circle">
                        <img id="senderAvatarImg" src="Default-User.png" alt="Avatar">
                    </div>
                    <h3 id="profileTitleText" style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">send me anonymous messages!</h3>
                    <p id="senderPlatformLabel" style="font-size: 12px; color: #94a3b8; text-transform: capitalize;">Instagram</p>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 16px;">
                    <textarea id="anonymousMessageInput" class="message-input-box" placeholder="send me anonymous messages..."></textarea>
                    <button id="sendMessageBtn" class="btn-action-primary" type="button">
                        Send! 🚀
                    </button>
                </div>
            </div>

            <!-- Step 2: Success / Options View (Hidden by default) -->
            <div id="successSection" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
                <div>
                    <div style="width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 12px auto; background: rgba(34, 197, 94, 0.15); border: 2px solid #22c55e; display: flex; align-items: center; justify-content: center; color: #22c55e; font-size: 28px;">
                        <i class="fas fa-check"></i>
                    </div>
                    <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 4px;">Message Sent! 🚀</h3>
                    <p style="font-size: 12px; color: #94a3b8;">Your anonymous message was delivered successfully.</p>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
                    <button id="sendAnotherBtn" class="btn-action-primary" type="button">
                        <i class="fas fa-paper-plane"></i> Send another message
                    </button>
                    
                    <a href="index.html" class="btn-action-secondary">
                        <i class="fas fa-user-plus" style="color: #ec4899;"></i> Setup your own
                    </a>

                    <a href="https://instagram.com/Jitu_Gurjar_99" target="_blank" class="btn-action-secondary">
                        <i class="fab fa-instagram" style="color: #f43f5e;"></i> Follow the developer
                    </a>
                </div>
            </div>

        </div>

        <!-- Bottom Spacer -->
        <div></div>

    </div>

    <script type="module" src="msgsender.js"></script>
</body>
</html>
