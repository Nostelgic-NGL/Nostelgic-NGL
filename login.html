<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostelgic NGL - Professional Setup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Professional Loading Overlay (Hidden by default) -->
    <div id="loadingOverlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
        <div style="background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-width: 280px; width: 90%;">
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #1e293b; border-top: 4px solid #ec4899; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
            <h3 style="color: #f8fafc; font-size: 16px; font-weight: 700; margin-bottom: 6px;">Creating Account</h3>
            <p style="color: #94a3b8; font-size: 12px;">Please wait while we set up your secure profile...</p>
        </div>
    </div>

    <div class="glass-card">
        <!-- Header with Local Logo -->
        <div class="text-center" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: center; margin-bottom: 10px;">
                <img src="Nostelgic-NGL.png" alt="Logo" style="width: 50px; height: 50px; object-fit: contain; border-radius: 12px;">
            </div>
            <h1 class="gradient-text" style="font-size: 26px; font-weight: 800; letter-spacing: 0.5px;">
                Nostelgic NGL
            </h1>
            <p id="stepIndicator" style="color: #94a3b8; font-size: 12px; margin-top: 4px;">Secure Anonymous Messaging Platform</p>
        </div>

        <!-- WELCOME / GET STARTED SCREEN -->
        <div id="welcomeScreen" class="text-center" style="display: flex; flex-direction: column; gap: 16px;">
            <p style="color: #cbd5e1; font-size: 13px; line-height: 1.5;">
                Generate your personalized link to receive secure, anonymous messages and confessions from your peers.
            </p>
            <button id="getStartedBtn" class="btn-primary" style="margin-top: 10px;">
                Get Started <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </div>

        <!-- STEP 1: Choose Platform -->
        <div id="step1" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
            <p style="font-size: 13px; color: #cbd5e1; text-align: center; margin-bottom: 6px;">Where will you share your link?</p>
            
            <button id="instaBtn" class="btn-secondary" style="justify-content: flex-start; padding: 12px 16px; gap: 14px;">
                <img src="Insta_Logo.png" alt="Instagram" style="width: 24px; height: 24px; object-fit: contain;">
                <span style="font-weight: 600;">Instagram Profile</span>
            </button>

            <button id="snapBtn" class="btn-secondary" style="justify-content: flex-start; padding: 12px 16px; gap: 14px;">
                <img src="Snap_Logo.png" alt="Snapchat" style="width: 24px; height: 24px; object-fit: contain;">
                <span style="font-weight: 600;">Snapchat Story</span>
            </button>
        </div>

        <!-- STEP 2: Choose Username -->
        <div id="step2" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
            <div>
                <label style="display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Choose Unique Username</label>
                <div style="display: flex; align-items: center; background: #020617; border: 1px solid #1e293b; border-radius: 14px; padding: 4px 14px;">
                    <span style="color: #64748b; font-size: 14px; margin-right: 4px;">@</span>
                    <input type="text" id="usernameInput" placeholder="your_username" class="input-box" style="border: none; padding: 10px 0; background: transparent;">
                </div>
            </div>
            <button id="nextBtn" class="btn-primary">
                Continue <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>
            </button>
            <button id="backBtn" style="background: transparent; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; padding: 4px;">Back</button>
        </div>

        <!-- STEP 3: Profile Photo Upload & Create Account Button -->
        <div id="step3" class="hidden text-center" style="display: flex; flex-direction: column; gap: 14px;">
            <p style="font-size: 13px; color: #cbd5e1;">Upload Profile Photo (Optional)</p>
            
            <div style="display: flex; justify-content: center; margin: 6px 0;">
                <label for="avatarFileInput" style="cursor: pointer;">
                    <div id="avatarPreviewContainer" style="width: 75px; height: 75px; background: #020617; border: 2px dashed #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b; overflow: hidden; position: relative;">
                        <i class="fas fa-camera" id="cameraIcon" style="font-size: 22px;"></i>
                        <img id="previewImg" class="hidden" style="width: 100%; height: 100%; object-fit: cover;" />
                    </div>
                </label>
                <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
            </div>

            <button id="completeBtn" class="btn-primary">
                Create Account 🚀
            </button>
            <button id="skipBtn" style="background: transparent; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; padding: 4px;">Skip for now</button>
        </div>

        <p id="errorMessage" style="color: #f87171; font-size: 11px; text-align: center; margin-top: 12px;" class="hidden"></p>
    </div>

    <!-- Spinner Animation Style -->
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script type="module" src="login.js"></script>
</body>
</html>
