<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostelgic NGL - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <!-- Logo / App Name -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">
                Nostelgic NGL
            </h1>
            <p class="text-slate-400 text-sm mt-1">Anonymous messages & confessions</p>
        </div>

        <!-- Tab Switcher (Login / Signup) -->
        <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
            <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-pink-600 text-white transition">Login</button>
            <button id="signupTabBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 transition">Sign Up</button>
        </div>

        <!-- Form Section -->
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="usernameField" class="hidden">
                <label class="block text-xs font-medium text-slate-400 mb-1">Username (Yehi aapka link banega)</label>
                <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-pink-500">
                    <span class="text-slate-500 text-sm mr-1">@</span>
                    <input type="text" id="username" placeholder="your_username" class="w-full bg-transparent text-white text-sm focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 font-semibold text-sm shadow-lg shadow-pink-600/30 active:scale-95 transition">
                Login
            </button>
        </form>

        <p id="errorMessage" class="text-red-400 text-xs text-center mt-4 hidden"></p>
    </div>

    <!-- Firebase Scripts & Main Logic -->
    <script type="module" src="login.js"></script>
</body>
</html>
