<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #030712; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 28px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .input-box { width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; color: #fff; margin-bottom: 14px; outline: none; font-size: 14px; }
        .btn { background: linear-gradient(135deg, #db2777 0%, #ff5e36 100%); color: #fff; font-weight: 700; width: 100%; padding: 14px; border-radius: 35px; border: none; cursor: pointer; font-size: 14px; box-shadow: 0 8px 20px rgba(255, 94, 54, 0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 20px; font-size: 20px;">Nostelgic NGL Login</h2>
        <input type="email" id="emailInput" class="input-box" placeholder="Enter your email">
        <input type="password" id="passwordInput" class="input-box" placeholder="Enter your password">
        <button id="loginBtn" class="btn">Login</button>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
