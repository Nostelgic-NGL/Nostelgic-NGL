<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostelgic NGL - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <!-- Logo -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">
                Nostelgic NGL
            </h1>
            <p id="stepIndicator" class="text-slate-400 text-xs mt-1">Step 1 of 3: Choose Platform</p>
        </div>

        <!-- STEP 1: Choose Platform (Instagram / Snapchat) -->
        <div id="step1" class="space-y-4">
            <p class="text-sm text-slate-300 text-center mb-4">Aap apna link kahan share karoge?</p>
            <button onclick="selectPlatform('instagram')" class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 rounded-xl font-semibold text-sm shadow-lg active:scale-95 transition">
                <i class="fab fa-instagram text-lg"></i> Instagram
            </button>
            <button onclick="selectPlatform('snapchat')" class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-yellow-400 text-slate-950 rounded-xl font-semibold text-sm shadow-lg active:scale-95 transition">
                <i class="fab fa-snapchat text-lg"></i> Snapchat
            </button>
        </div>

        <!-- STEP 2: Choose Username -->
        <div id="step2" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Apna Unique Username chuno</label>
                <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 focus-within:border-pink-500">
                    <span class="text-slate-500 text-sm mr-1">@</span>
                    <input type="text" id="usernameInput" placeholder="your_name" class="w-full bg-transparent text-white text-sm focus:outline-none">
                </div>
            </div>
            <button onclick="nextToStep3()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 font-semibold text-sm shadow-lg shadow-pink-600/30 active:scale-95 transition">
                Next <i class="fas fa-arrow-right ml-1"></i>
            </button>
            <button onclick="goBackToStep1()" class="w-full py-2 text-xs text-slate-400 hover:text-white transition">Back</button>
        </div>

        <!-- STEP 3: Profile Photo / Avatar (Optional / Skip) -->
        <div id="step3" class="space-y-4 hidden text-center">
            <p class="text-sm text-slate-300">Profile Photo lagao ya skip karo</p>
            <div class="flex justify-center my-4">
                <div class="w-20 h-20 bg-slate-800 border-2 border-dashed border-slate-700 rounded-full flex items-center justify-center text-slate-400 overflow-hidden relative">
                    <i class="fas fa-user text-2xl" id="avatarIcon"></i>
                    <img id="avatarPreview" class="w-full h-full object-cover hidden" />
                </div>
            </div>
            <div>
                <input type="text" id="avatarUrlInput" placeholder="Image URL dalein (Optional)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-pink-500 mb-3">
            </div>
            <button onclick="completeSetup()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 font-semibold text-sm shadow-lg shadow-pink-600/30 active:scale-95 transition">
                Let's Go! 🚀
            </button>
            <button onclick="skipAndComplete()" class="w-full py-2 text-xs text-slate-400 hover:text-white transition">Skip for now</button>
        </div>

        <p id="errorMessage" class="text-red-400 text-xs text-center mt-4 hidden"></p>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
