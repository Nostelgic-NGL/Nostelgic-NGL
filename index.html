<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 10px 14px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #030712;
        }

        .main-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 2px;
        }

        .nav-tabs {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            display: flex;
            padding: 3px;
            gap: 4px;
        }

        .nav-tab {
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
        }

        /* Single Unified Card containing everything */
        .single-unified-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }

        .avatar-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            border: 2px solid #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            overflow: hidden;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .step-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .step-title {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            color: #cbd5e1;
        }

        .link-row {
            display: flex;
            align-items: center;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 4px 4px 4px 12px;
        }

        .link-text {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .btn-sm-copy {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #db2777 0%, #ff5e36 100%);
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 94, 54, 0.3);
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;">
        <div style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; border-radius: 22px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); max-width: 280px; width: 90%;">
            <div style="font-size: 28px; margin-bottom: 10px; color: #ec4899;"><i class="fas fa-info-circle"></i></div>
            <h3 style="color: #f8fafc; font-size: 15px; font-weight: 700; margin-bottom: 4px;">Notification</h3>
            <p id="customAlertText" style="color: #94a3b8; font-size: 12px; margin-bottom: 16px; line-height: 1.4;">Action successful!</p>
            <button id="customAlertOkBtn" style="background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; border: none; width: 100%; padding: 10px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer;">OK</button>
        </div>
    </div>

    <!-- Hidden / Dummy elements required by index.js to prevent null reference errors -->
    <div class="hidden">
        <input type="text" id="customMessageInput">
        <button id="sendBtn"></button>
        <div id="messagesContainer"></div>
    </div>

    <div class="main-container">
        
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <button id="themeToggleBtn" class="icon-btn" type="button">
                <i class="fas fa-moon" style="font-size: 13px;"></i>
            </button>
            
            <div class="nav-tabs">
                <button class="nav-tab active">HOME</button>
                <button id="toInboxBtn" class="nav-tab" type="button">INBOX</button>
            </div>

            <button id="logoutBtn" class="icon-btn" style="color: #f87171;" type="button">
                <i class="fas fa-sign-out-alt" style="font-size: 13px;"></i>
            </button>
        </div>

        <!-- Single Unified Card -->
        <div class="single-unified-card">
            
            <!-- Profile Section -->
            <div>
                <div class="avatar-circle">
                    <img id="userAvatarImg" src="Default-User.png" alt="Avatar">
                </div>
                <h3 style="font-size: 13px; font-weight: 800; margin-bottom: 2px;">send me anonymous messages!</h3>
                <p id="platformLabel" style="font-size: 11px; color: #94a3b8; text-transform: capitalize;">Instagram</p>
            </div>

            <div style="height: 1px; background: rgba(255, 255, 255, 0.06); width: 100%;"></div>

            <!-- Step 1 Section -->
            <div class="step-section">
                <p class="step-title">Step 1: Copy your link</p>
                <div class="link-row">
                    <span id="profileLinkText" class="link-text">https://loading...</span>
                    <button id="copyLinkBtn" class="btn-sm-copy" type="button">copy link</button>
                </div>
            </div>

            <div style="height: 1px; background: rgba(255, 255, 255, 0.06); width: 100%;"></div>

            <!-- Step 2 Section -->
            <div class="step-section">
                <p class="step-title">Step 2: Share link on your story</p>
                <button id="shareStoryBtn" class="btn-action-primary" type="button">
                    Share!
                </button>
            </div>

        </div>

    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
