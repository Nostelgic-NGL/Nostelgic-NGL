<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 10px 14px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            background-color: #030712;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Navigation Bar shifted to extreme top */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 2px 0 2px;
        }

        .nav-tabs {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            display: flex;
            padding: 3px;
            gap: 4px;
        }

        .nav-tab {
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
        }

        /* Profile Box */
        .profile-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: 16px 20px;
            text-align: center;
        }

        .avatar-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            border: 2px solid #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            overflow: hidden;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Combined Single Card for Step 1 and Step 2 */
        .unified-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step-title {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            color: #cbd5e1;
        }

        .link-row {
            display: flex;
            align-items: center;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 4px 4px 4px 12px;
        }

        .link-text {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .btn-sm-copy {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #db2777 0%, #ff5e36 100%);
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            padding: 13px;
            border-radius: 35px;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 94, 54, 0.3);
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Top Navigation Bar (Shifted to top as marked green) -->
        <div class="top-nav">
            <button id="themeToggleBtn" class="icon-btn">
                <i class="fas fa-moon" style="font-size: 13px;"></i>
            </button>
            
            <div class="nav-tabs">
                <button class="nav-tab active">HOME</button>
                <button id="toInboxBtn" class="nav-tab">INBOX</button>
            </div>

            <button id="logoutBtn" class="icon-btn" style="color: #f87171;">
                <i class="fas fa-sign-out-alt" style="font-size: 13px;"></i>
            </button>
        </div>

        <!-- Profile Box -->
        <div class="profile-box">
            <div class="avatar-circle">
                <img id="userAvatarImg" src="Default-User.png" alt="Avatar">
            </div>
            <h3 style="font-size: 14px; font-weight: 800; margin-bottom: 2px;">send me anonymous messages!</h3>
            <p id="platformLabel" style="font-size: 11px; color: #94a3b8; text-transform: capitalize;">Instagram</p>
        </div>

        <!-- Combined Single Card for Both Steps -->
        <div class="unified-card">
            <!-- Step 1 Section -->
            <div class="step-section">
                <p class="step-title">Step 1: Copy your link</p>
                <div class="link-row">
                    <span id="profileLinkText" class="link-text">https://loading...</span>
                    <button id="copyLinkBtn" class="btn-sm-copy">copy link</button>
                </div>
            </div>

            <div style="height: 1px; background: rgba(255, 255, 255, 0.06); width: 100%;"></div>

            <!-- Step 2 Section -->
            <div class="step-section">
                <p class="step-title">Step 2: Share link on your story</p>
                <button id="shareStoryBtn" class="btn-action-primary">
                    Share!
                </button>
            </div>
        </div>

    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
