<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Compact layout adjustments to fit perfectly without vertical scrolling */
        body {
            padding: 12px;
            box-sizing: border-box;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .nav-tabs {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            display: flex;
            padding: 4px;
            gap: 4px;
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* Profile Preview Card */
        .profile-box {
            text-align: center;
            padding: 16px 20px;
        }

        .avatar-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            border: 2px solid #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
            overflow: hidden;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Action Step Cards */
        .step-card {
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-title {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            color: #cbd5e1;
        }

        .link-row {
            display: flex;
            align-items: center;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 2px 4px 2px 12px;
        }

        .link-text {
            font-size: 12px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .btn-sm-copy {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <button id="themeToggleBtn" class="icon-btn">
                <i class="fas fa-moon" style="font-size: 14px;"></i>
            </button>
            
            <div class="nav-tabs">
                <button class="nav-tab active">HOME</button>
                <button id="toInboxBtn" class="nav-tab">INBOX</button>
            </div>

            <button id="logoutBtn" class="icon-btn" style="color: #f87171;">
                <i class="fas fa-sign-out-alt" style="font-size: 14px;"></i>
            </button>
        </div>

        <!-- Profile / Status Glass Card -->
        <div class="glass-card profile-box">
            <div class="avatar-circle">
                <img id="userAvatarImg" src="Default-User.png" alt="Avatar">
            </div>
            <h3 style="font-size: 15px; font-weight: 800; margin-bottom: 2px;">send me anonymous messages!</h3>
            <p id="platformLabel" style="font-size: 11px; color: #94a3b8; text-transform: capitalize;">Instagram</p>
        </div>

        <!-- Step 1: Copy Link Card -->
        <div class="glass-card step-card">
            <p class="step-title">Step 1: Copy your link</p>
            <div class="link-row">
                <span id="profileLinkText" class="link-text">https://loading...</span>
                <button id="copyLinkBtn" class="btn-sm-copy">copy link</button>
            </div>
        </div>

        <!-- Step 2: Share Link Card -->
        <div class="glass-card step-card">
            <p class="step-title">Step 2: Share link on your story</p>
            <button id="shareStoryBtn" class="btn-primary" style="padding: 12px; font-size: 14px;">
                Share! 🚀
            </button>
        </div>

    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
