<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostelgic NGL - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 70px;
        }
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        .hidden { display: none !important; }

        /* Top Bar */
        .top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .theme-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        body.light-mode .theme-btn { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); color: #000; }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* Home View */
        .profile-card {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        body.light-mode .profile-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }

        .avatar-box {
            width: 80px; height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ec4899;
            margin-bottom: 15px;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .platform-badge {
            background: rgba(236, 72, 153, 0.15);
            color: #ec4899;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .link-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-size: 13px;
            color: #94a3b8;
            word-break: break-all;
            margin-bottom: 20px;
        }
        body.light-mode .link-box { background: rgba(0,0,0,0.02); border: 1px dashed rgba(0,0,0,0.15); color: #64748b; }

        .btn-group { display: flex; gap: 10px; width: 100%; }
        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; }
        body.light-mode .btn-secondary { background: rgba(0, 0, 0, 0.06); color: #0f172a; }

        /* Inbox View */
        .inbox-header { width: 100%; font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: left; }
        .messages-container { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .message-card {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            display: flex; flex-direction: column; gap: 10px;
        }
        body.light-mode .message-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.08); }
        .msg-header { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
        .msg-text { font-size: 15px; color: #fff; line-height: 1.5; word-break: break-word; }
        body.light-mode .msg-text { color: #0f172a; }
        .msg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-reply { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Settings View */
        .settings-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .setting-item {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 14px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 15px; font-weight: 500; cursor: pointer;
        }
        body.light-mode .setting-item { background: #ffffff; border: 1px solid rgba(0,0,0,0.08); color: #0f172a; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0b0f19;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }
        body.light-mode .bottom-nav { background: #ffffff; border-top: 1px solid rgba(0,0,0,0.08); }
        .nav-item {
            background: none; border: none; color: #94a3b8;
            font-size: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #ec4899; }

        /* Custom Alert Modal */
        .custom-alert-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .custom-alert-box {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px; border-radius: 20px;
            width: 85%; max-width: 320px;
            text-align: center; display: flex; flex-direction: column; gap: 15px;
        }
        body.light-mode .custom-alert-box { background: #ffffff; border: 1px solid rgba(0,0,0,0.1); color: #0f172a; }
        .custom-alert-box p { font-size: 14px; color: #cbd5e1; }
        body.light-mode .custom-alert-box p { color: #475569; }
        .custom-alert-ok {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">Nostelgic NGL</div>
        <button class="theme-btn" id="themeToggleBtn"><i class="fas fa-moon" id="themeIcon"></i></button>
    </div>

    <!-- Main Views Container -->
    <div class="container">

        <!-- Home View -->
        <div id="homeView" class="container" style="padding: 0; max-width: 100%;">
            <div class="profile-card">
                <div class="avatar-box">
                    <img id="userAvatarImg" src="https://via.placeholder.com/150" alt="Avatar">
                </div>
                <div class="platform-badge" id="platformLabel">Instagram</div>
                <div class="link-box" id="profileLinkText">Loading link...</div>
                <div class="btn-group">
                    <button class="action-btn btn-secondary" id="copyLinkBtn"><i class="fas fa-copy"></i> Copy Link</button>
                    <button class="action-btn btn-primary" id="shareStoryBtn"><i class="fas fa-share-nodes"></i> Share</button>
                </div>
            </div>
        </div>

        <!-- Inbox View -->
        <div id="inboxView" class="container hidden" style="padding: 0; max-width: 100%;">
            <div class="inbox-header">Inbox</div>
            <div class="messages-container" id="messagesContainer"></div>
            <div id="emptyState" style="text-align: center; color: #94a3b8; margin-top: 50px;">
                <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 10px; opacity: 0.5;"></i>
                <p>No messages yet!</p>
            </div>
        </div>

        <!-- Settings View -->
        <div id="settingsView" class="container hidden" style="padding: 0; max-width: 100%;">
            <div class="inbox-header">Settings</div>
            <div class="settings-list">
                <div class="setting-item" id="pauseLinkOption">
                    <span><i class="fas fa-pause-circle" style="color: #ec4899; margin-right: 8px;"></i> Pause my link</span>
                    <i class="fas fa-chevron-right" style="color: #94a3b8; font-size: 13px;"></i>
                </div>
                <!-- PC Style Ctrl+F5 Hard Refresh Button -->
                <div class="setting-item" id="hardRefreshOption">
                    <span><i class="fas fa-rotate" style="color: #38bdf8; margin-right: 8px;"></i> Clear Cache & Hard Refresh</span>
                    <i class="fas fa-chevron-right" style="color: #94a3b8; font-size: 13px;"></i>
                </div>
                <div class="setting-item" id="deleteAccountOption" style="color: #ef4444;">
                    <span><i class="fas fa-trash-alt" style="margin-right: 8px;"></i> Delete account</span>
                    <i class="fas fa-chevron-right" style="font-size: 13px;"></i>
                </div>
                <div class="setting-item" id="logoutBtn" style="color: #f59e0b;">
                    <span><i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i> Logout</span>
                    <i class="fas fa-chevron-right" style="font-size: 13px;"></i>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navHomeBtn"><i class="fas fa-home"></i>Home</button>
        <button class="nav-item" id="navInboxBtn"><i class="fas fa-inbox"></i>Inbox</button>
        <button class="nav-item" id="settingsBtn"><i class="fas fa-gear"></i>Settings</button>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="custom-alert-modal hidden">
        <div class="custom-alert-box">
            <h3 style="font-size: 18px; font-weight: 600;">Nostelgic NGL</h3>
            <p id="customAlertText">Alert message here</p>
            <button class="custom-alert-ok" id="customAlertOkBtn">OK</button>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
