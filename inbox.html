<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nostelgic NGL - Inbox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light Theme Overrides */
        body.light-mode {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
        }
        body.light-mode .message-card,
        body.light-mode .nav-tabs,
        body.light-mode .icon-btn {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06) !important;
        }
        body.light-mode .nav-tab {
            color: #64748b !important;
        }
        body.light-mode .nav-tab.active {
            color: #ffffff !important;
        }
        body.light-mode .icon-btn {
            color: #0f172a !important;
        }
        body.light-mode .msg-text {
            color: #1e293b !important;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        @media (min-width: 480px) {
            .main-container {
                height: 90vh;
                border-radius: 36px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            }
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .nav-tabs {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            display: flex;
            padding: 3px;
            gap: 4px;
        }

        .nav-tab {
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
        }

        /* Messages Scrollable Area */
        .messages-scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 16px 0;
            padding-right: 4px;
        }

        .messages-scroll-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Message Card Style */
        .message-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
        }

        .msg-text {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.4;
            word-break: break-word;
            user-select: text;
        }

        .msg-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-reply {
            background: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Empty State */
        .empty-inbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #64748b;
            gap: 10px;
        }

        .empty-inbox i {
            font-size: 48px;
            color: #334155;
            margin-bottom: 4px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;">
        <div style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; border-radius: 24px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); max-width: 280px; width: 90%;">
            <div style="font-size: 32px; margin-bottom: 12px; color: #ec4899;"><i class="fas fa-info-circle"></i></div>
            <h3 style="color: #f8fafc; font-size: 16px; font-weight: 700; margin-bottom: 6px;">Notification</h3>
            <p id="customAlertText" style="color: #94a3b8; font-size: 12px; margin-bottom: 20px; line-height: 1.4;">Action successful!</p>
            <button id="customAlertOkBtn" style="background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; border: none; width: 100%; padding: 12px; border-radius: 30px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 5px 15px rgba(219,39,119,0.4);">OK</button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <button id="themeToggleBtn" class="icon-btn" type="button">
                <i id="themeIcon" class="fas fa-moon" style="font-size: 14px;"></i>
            </button>
            
            <div class="nav-tabs">
                <button id="toHomeBtn" class="nav-tab" type="button">HOME</button>
                <button class="nav-tab active">INBOX</button>
            </div>

            <button id="settingsBtn" class="icon-btn" type="button" title="Settings">
                <i class="fas fa-cog" style="font-size: 14px;"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="messagesContainer" class="messages-scroll-area">
            <!-- Dynamic Messages will load here -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="empty-inbox hidden">
            <i class="far fa-envelope-open"></i>
            <p style="font-size: 14px; font-weight: 700;">No messages yet!</p>
            <p style="font-size: 11px;">Share your link to start receiving anonymous messages.</p>
        </div>

        <!-- Bottom Spacer -->
        <div></div>

    </div>

    <script type="module" src="inbox.js"></script>
</body>
</html>
