<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Anonymous Message - Nostelgic NGL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <div id="success-overlay" class="loading-overlay" style="display: none;">
            <div class="loading-card">
                <div class="spinner"></div>
                <h3>Sending message...</h3>
                <p>Please wait a moment</p>
            </div>
        </div>

        <div class="screen active" id="view-send-screen" style="justify-content: flex-start; padding-top: 20px;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;">
                <div class="story-avatar-wrap" id="send-avatar-wrap" style="width: 75px; height: 75px;">
                    <i class="fa-solid fa-user" id="send-default-icon"></i>
                    <img id="send-img-tag" src="" alt="Avatar" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 id="target-username-title" style="font-size: 16px; font-weight: 600; color: #fff;">@loading...</h3>
            </div>

            <div style="width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
                <textarea id="msg-input-box" placeholder="send me anonymous messages..." style="width: 100%; height: 120px; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; resize: none;"></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 11px; color: #64748b;"><i class="fa-solid fa-shield-halved"></i> 100% Anonymous</span>
                    <button class="btn-primary" id="btn-send-msg" style="width: auto; padding: 10px 24px; font-size: 14px; border-radius: 12px;">Send</button>
                </div>
            </div>

            <div style="margin-top: auto; padding-bottom: 15px; text-align: center;">
                <p style="font-size: 12px; color: #64748b;">Get your own anonymous messages link!</p>
                <a href="index.html" style="color: #a78bfa; font-size: 13px; font-weight: 600; text-decoration: none;">Create your NGL</a>
            </div>
        </div>

        <div class="screen" id="view-success-screen" style="text-align: center; gap: 15px;">
            <div style="width: 70px; height: 70px; background: rgba(16, 185, 129, 0.15); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #10b981; font-size: 38px; margin: 0 auto;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <h2 style="font-size: 22px; font-weight: 700; color: #fff;">All Done!</h2>
                <p style="font-size: 12px; color: #94a3b8;">Your anonymous message was sent successfully.</p>
            </div>

            <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-primary" id="btn-send-another">
                    Send another message <i class="fa-solid fa-arrow-rotate-right"></i>
                </button>
                <button class="ngl-btn-outline" id="btn-get-own">
                    Get your own messages! <i class="fa-solid fa-sparkles"></i>
                </button>
                <a href="https://instagram.com/Jitu_Gurjar_99" target="_blank" class="ngl-btn-outline" style="text-decoration: none; border-color: #fd1d1d; color: #ff7a00; display: flex; justify-content: center; align-items: center; gap: 8px;">
                    <i class="fa-brands fa-instagram"></i> Follow the Developer
                </a>
            </div>
        </div>

    </div>

    <script type="module" src="send.js"></script>
</body>
</html>
